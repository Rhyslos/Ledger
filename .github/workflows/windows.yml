# Every push to main builds Ledger, numbers it 0.1.<run number> and publishes
# it as a GitHub release. Installed copies of Ledger find it through
# latest.json, download it in the background and offer "Restart to update".
# Needs the repo secret TAURI_SIGNING_PRIVATE_KEY (the updater signing key).
#
# Two jobs, so the project's own packages never come near the key or a write token:
#   build    installs the npm packages, runs the tests and builds, with a read-only token
#            and no secrets, and hands the installer over as an artifact.
#   publish  (main only) never runs npm ci: it installs just the Tauri signer, without
#            install scripts, signs the installer, writes latest.json and makes the release.
# Third-party actions are pinned to a commit, so a moved tag can't change what runs here.
name: Windows build

on:
  push:
    branches: [main]
  # Pull requests are built too, so a broken build shows up before merging. Only main publishes.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# When several merges land close together, only the build of the newest commit publishes; the
# others are skipped instead of cancelled, so nothing is stopped half-way. (An older build finishing
# last would otherwise become the "latest" release, missing the newer changes.) A pull request's
# build is skipped once the pull request is merged or closed, since main builds it then.
jobs:
  newest:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
            [ "$head" = "$GITHUB_SHA" ] || { go=false; echo "::notice::A newer commit is on $GITHUB_REF_NAME; its build publishes instead."; }
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .state)
            [ "$state" = open ] || { go=false; echo "::notice::The pull request is $state; the build of main covers it."; }
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: newest
    if: needs.newest.outputs.go == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.number.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # No install scripts: nothing in the dependency tree runs code while installing (the build
      # tools' native parts come as their own packages and need no script).
      - run: npm ci --ignore-scripts

      - name: Run the tests
        run: npm test

      - name: Number this build
        id: number
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          $f = "src-tauri/tauri.conf.json"
          (Get-Content $f -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$v`"" | Set-Content $f -NoNewline
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building Ledger $v"

      - name: Make sure no debug hooks go into a release
        shell: pwsh
        run: |
          if ($env:VITE_DEBUG -or $env:VITE_TEST) { throw "VITE_DEBUG / VITE_TEST must not be set for a release build." }

      - run: npm run tauri build

      # After the build, so it reuses the release build's compiled dependencies.
      - name: Run the Rust tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib

      - name: Collect the installer and the portable exe
        shell: pwsh
        run: ./scripts/collect.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    # Only builds of main become releases (and so updates): not pull requests, and not a manual
    # run on another branch. Settings > Environments > release can require an approval too.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The one job that may write: it makes the release.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-build
          path: release

      - name: Install the Tauri signer on its own
        run: |
          lock="$PWD/package-lock.json"
          mkdir -p "$RUNNER_TEMP/signer" && cd "$RUNNER_TEMP/signer"
          npm init -y > /dev/null
          # Only Tauri's own CLI and its Linux binary, at the versions in the lockfile, checked
          # against the lockfile's hashes before use, and installed without install scripts.
          for pkg in cli cli-linux-x64-gnu; do
            entry="node_modules/@tauri-apps/$pkg"
            v=$(node -p "require('$lock').packages['$entry'].version")
            want=$(node -p "require('$lock').packages['$entry'].integrity")
            file=$(npm pack --silent "@tauri-apps/$pkg@$v")
            got="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
            [ "$got" = "$want" ] || { echo "::error::@tauri-apps/$pkg@$v doesn't match the lockfile's hash"; exit 1; }
          done
          npm install --ignore-scripts --no-audit --no-fund --offline ./tauri-apps-cli-*.tgz
          echo "$RUNNER_TEMP/signer/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Sign the installer for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Add the secret TAURI_SIGNING_PRIVATE_KEY (Settings > Secrets and variables > Actions). Updates can't be published without it."; exit 1; }
          setup=$(ls release/*-setup.exe | head -1)
          tauri signer sign "$setup"
          [ -f "$setup.sig" ] || { echo "::error::Signing didn't make $(basename "$setup").sig"; exit 1; }

      - name: Write latest.json for the updater
        env:
          V: ${{ needs.build.outputs.version }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          setup=$(ls release/*-setup.exe | head -1)
          node -e '
            const fs = require("fs"), [setup, v, repo] = process.argv.slice(1);
            const name = setup.split("/").pop();
            fs.writeFileSync("release/latest.json", JSON.stringify({
              version: v,
              notes: (process.env.NOTES || "").split("\n")[0],
              pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(setup + ".sig", "utf8").trim(), url: `https://github.com/${repo}/releases/download/v${v}/${name}` } },
            }, null, 2));
          ' "$setup" "$V" "$GITHUB_REPOSITORY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          # Still the newest? A merge that landed while this built publishes instead.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          [ "$head" = "$GITHUB_SHA" ] || { echo "::notice::A newer commit is on $GITHUB_REF_NAME; not publishing $V."; exit 0; }
          gh release create "v$V" release/* --repo "$GITHUB_REPOSITORY" --title "Ledger $V" --notes "${NOTES:-Ledger $V}" --target "$GITHUB_SHA"
