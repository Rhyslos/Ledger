# Builds the Windows installer and a portable .exe on every push to main, numbers
# it 0.1.<run number>, and publishes it as a release (Releases on the repo page).
# Ledger checks those releases on start and shows "Update" when one is newer.
name: Windows build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Number this build
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          $f = "src-tauri/tauri.conf.json"
          (Get-Content $f -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$v`"" | Set-Content $f -NoNewline
          "LEDGER_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Building Ledger $v"

      - run: npm run tauri build

      - name: Collect the installer and the portable exe
        shell: pwsh
        run: ./scripts/collect.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/
          if-no-files-found: error

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release create "v$env:LEDGER_VERSION" @files --title "Ledger $env:LEDGER_VERSION" --generate-notes --target "$env:GITHUB_SHA"
