# Every push to main builds Ledger, numbers it 0.1.<run number> and publishes
# it as a GitHub release. Installed copies of Ledger find it through
# latest.json, download it in the background and offer "Restart to update".
# Needs the repo secret TAURI_SIGNING_PRIVATE_KEY (the updater signing key).
name: Windows build

on:
  push:
    branches: [main, master]
  # Pull requests are built too, so a broken build shows up before merging. Only main publishes.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# When several merges land close together, only the build of the newest commit publishes; the
# others are skipped instead of cancelled, so nothing is stopped half-way. (An older build finishing
# last would otherwise become the "latest" release, missing the newer changes.) A pull request's
# build is skipped once the pull request is merged or closed, since main builds it then.
jobs:
  newest:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
            [ "$head" = "$GITHUB_SHA" ] || { go=false; echo "::notice::A newer commit is on $GITHUB_REF_NAME; its build publishes instead."; }
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" --jq .state)
            [ "$state" = open ] || { go=false; echo "::notice::The pull request is $state; the build of main covers it."; }
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: newest
    if: needs.newest.outputs.go == 'true'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Check the signing key is set
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Add the secret TAURI_SIGNING_PRIVATE_KEY (Settings > Secrets and variables > Actions). Updates can't be published without it."
          }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Number this build
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          $f = "src-tauri/tauri.conf.json"
          (Get-Content $f -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$v`"" | Set-Content $f -NoNewline
          "LEDGER_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Building Ledger $v"

      # Signed updater files only here: local build.ps1 builds without the key.
      - if: github.event_name != 'pull_request'
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
      - if: github.event_name == 'pull_request'
        run: npm run tauri build

      - name: Collect the installer and the portable exe
        shell: pwsh
        run: ./scripts/collect.ps1

      - name: Write latest.json for the updater
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $v = $env:LEDGER_VERSION
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          $sig = Get-Content "$($setup.FullName).sig" -Raw
          $latest = [ordered]@{
            version = $v
            notes = (git log -1 --pretty=%s)
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/$($setup.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content "release/latest.json" -Encoding utf8NoBOM

      - name: Publish the release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:LEDGER_VERSION
          # Still the newest? A merge that landed while this built publishes instead.
          $head = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_REF_NAME" --jq .sha
          if ($head -ne $env:GITHUB_SHA) { Write-Host "::notice::A newer commit is on $env:GITHUB_REF_NAME; not publishing $v."; exit 0 }
          gh release create "v$v" (Get-ChildItem release -File).FullName --title "Ledger $v" --notes "$(git log -1 --pretty=%B)" --target $env:GITHUB_SHA

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/
          if-no-files-found: error
